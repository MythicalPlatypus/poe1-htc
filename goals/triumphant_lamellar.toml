# goals/triumphant_lamellar.toml

[item]
base = "Triumphant Lamellar"
item_level = 77
rarity = "normal"

# Hunter influence can produce Spell Critical Strike Chance and % maximum Life.
[[methods]]
type = "conqueror_exalt"
influence = "hunter"

# Highest dual-resistance bench crafts available at item level 77.
[[methods]]
type = "bench"
name = "Bench: Fire and Cold Resistances"
mod_id = "EinharMasterFireAndColdResist3"
cost = 3.0

[[methods]]
type = "bench"
name = "Bench: Cold and Lightning Resistances"
mod_id = "EinharMasterColdAndLightningResist3_"
cost = 3.0

[[methods]]
type = "bench"
name = "Bench: Fire and Lightning Resistances"
mod_id = "EinharMasterFireAndLightningResist3_"
cost = 3.0

# Hybrid elemental/chaos bench alternatives.
[[methods]]
type = "bench"
name = "Bench: Cold and Chaos Resistances"
