mod_id = "JunMaster2StrengthAndDexterity2"
cost = 2.0

# ---------------------------------------------------------------------------
# Reroll methods beyond Chaos Orbs. Essences guarantee one mod while
# rerolling; Harvest reforges guarantee a mod with the target tag and keep
# influence, so post-Hunter-slam they can force the spell crit suffix
# (tags: caster + critical — the only critical-tag mods on a body armour).
# Costs are Allflame softcore day-2: lifeforce ~0.016c each; reforge amounts
# 50 (elemental/life) and ~150 (caster/critical) crystallised lifeforce.
# ---------------------------------------------------------------------------

[[methods]]
type = "essence"
essence = "Deafening Essence of Greed"  # guaranteed 160-174 life, rerolls rest
cost = 2.0

[[methods]]
type = "essence"
essence = "Screaming Essence of Greed"  # guaranteed 130-144 life, cheaper
cost = 0.85

[[methods]]
type = "harvest"
op = "reforge"
target = "life"
cost = 1.0

[[methods]]
type = "harvest"
op = "reforge"
target = "caster"
cost = 2.5

[[methods]]
type = "harvest"
op = "reforge"
target = "critical"
cost = 2.5

