 # Stress-test goal: a "mirror-tier" Astral Plate — six specific high-tier mods.
# This is intentionally at the edge of what the model can plan: the final slams
# are one-shot Exalts, so watch the success probability and both cost scenarios
# diverge. Run with a seed to compare parameter tweaks fairly:
#   cargo run --release -- --goal goals/mirror_tier_chest.toml --seed 1

[item]
base = "Astral Plate"
item_level = 86

# Prefixes: T1 life, T1 armour%, plus any flat armour.
[[wants]]
group = "IncreasedLife"
stat = "base_maximum_life"
min_value = 175          # T1 (IncreasedLife12) only in RePoE 3.28.0.16
weight = 10.0

[[wants]]
group = "DefencesPercent"
weight = 8.0

[[wants]]
group = "BaseLocalDefences"    # flat armour
weight = 6.0

# Suffixes: near-T1 tri-res.
[[wants]]
stat = "base_fire_damage_resistance_%"
min_value = 40
weight = 8.0

[[wants]]
stat = "base_cold_damage_resistance_%"
min_value = 40
weight = 8.0

[[wants]]
stat = "base_lightning_damage_resistance_%"
min_value = 40
weight = 8.0

[search]
beam_width = 30
max_steps = 12
cost_weight = 0.005      # want weights sum to 48; tolerate ~200c per point

# Allflame softcore exchange rates (poe.ninja, 2026-07-25). Chaos Orb is the
# pricing unit (1.0) and needs no override.
[prices]
"Orb of Transmutation" = 0.013
"Orb of Augmentation" = 0.023
"Orb of Alchemy" = 0.055
"Orb of Alteration" = 0.10
"Regal Orb" = 0.30
"Orb of Scouring" = 0.40
"Exalted Orb" = 0.82
"Orb of Annulment" = 3.75
"Divine Orb" = 90.6
