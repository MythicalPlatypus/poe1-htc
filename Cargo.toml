[package]
name = "poe1_htc"
version = "0.1.0"
edition = "2021"

[lib]
name = "poe1_htc"
path = "src/lib.rs"

[[bin]]
name = "poe1_htc"
path = "src/main.rs"

[dependencies]
# Serialization / deserialization of RePoE JSON data
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Parallel iteration for beam search and mod evaluation
rayon = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Stable source-bundle fingerprints for loaded RePoE data
sha2 = "0.10"

# Ordered float for priority queues in beam search
ordered-float = "4"

# Random number generation for weighted mod selection and stat rolling
rand = "0.9"

# Goal specification files (what the user wants to craft)
toml = "0.8"

[dev-dependencies]
# Execute the checked saved-request contract against Draft 2020-12.
jsonschema = { version = "0.49.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
